# Keep a copied template independent when it is nested inside another pnpm workspace.
packages: []

allowBuilds:
  # tsx and Vitest use esbuild's install script to select the platform binary.
  esbuild: true
  # swagger-ui-dist pulls in Scarf's install-time analytics; never run it.
  "@scarf/scarf": false

# CommonGrants packages are first-party for this template and skip pnpm's release-age hold.
minimumReleaseAgeExclude:
  - "@common-grants/*"
